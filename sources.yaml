# Источники плейлистов. Порядок = приоритет: при дублировании канала
# (по tvg-id или имени) остаётся запись из более раннего источника.
sources:
  - name: IPTVru-stable
    url: https://smolnp.github.io/IPTVru/IPTVstable.m3u8
    # Федеральные + местные (в т.ч. Чаваш ЕН) — основной источник
  - name: iptv-org-ru
    url: https://iptv-org.github.io/iptv/countries/ru.m3u
    # Общедоступные каналы РФ — добирает то, чего нет в IPTVru
  - name: iptv-org-ru-extra
    url: https://iptv-org.github.io/iptv/languages/rus.m3u
    # Русскоязычные каналы (включая зарубежные) — на добор

# Мёртвые потоки: true = удалять из итогового плейлиста, false = помечать [DEAD]
drop_dead: true

# Повторная проверка упавших потоков (защита от ложных срабатываний)
retries: 1

# Таймаут проверки одного потока, секунд
timeout: 8

# Параллельных проверок одновременно
concurrency: 24

# Фиксированный порядок в начале плейлиста: эфирные мультиплексы РФ
# (каналы 1-10 и 11-20) + Чаваш ЕН на 21-м месте.
# match — варианты имён каналов в источниках; сравнение нормализованное
# (регистр/пробелы/пунктуация/«HD» игнорируются). Канал получает атрибут
# tvg-chno со своим номером. Не найденный в источниках слот пропускается.
fixed_order:
  - {name: Первый канал,  match: [Первый канал, 1 канал, Channel One]}
  - {name: Россия-1,      match: [Россия 1, Россия-1]}
  - {name: Матч,          match: [Матч, Матч ТВ, Матч!]}
  - {name: НТВ,           match: [НТВ]}
  - {name: Пятый канал,   match: [Пятый канал, 5 канал]}
  - {name: Россия-К,      match: [Россия К, Россия-Культура, Культура]}
  - {name: Россия-24,     match: [Россия 24, Россия-24, Вести 24]}
  - {name: Карусель,      match: [Карусель]}
  - {name: ОТР,           match: [ОТР, Общественное телевидение России]}
  - {name: ТВ Центр,      match: [ТВ Центр, ТВЦ]}
  - {name: РЕН ТВ,        match: [РЕН ТВ, Рен ТВ]}
  - {name: Спас,          match: [Спас, Спас ТВ]}
  - {name: СТС,           match: [СТС]}
  - {name: Домашний,      match: [Домашний]}
  - {name: ТВ-3,          match: [ТВ-3, ТВ3]}
  - {name: Пятница,       match: [Пятница, Пятница!]}
  - {name: Звезда,        match: [Звезда]}
  - {name: Мир,           match: [Мир]}
  - {name: ТНТ,           match: [ТНТ]}
  - {name: Муз-ТВ,        match: [Муз-ТВ, Муз ТВ]}
  - {name: Чаваш ЕН,      match: [Чаваш ЕН, Чаваш Ен, Chuvash En]}
